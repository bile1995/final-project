<!DOCTYPE html>
<html>
<head>
  <title>Add User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
  <h2 class="mb-4">Add New User</h2>

  <form action="../php/admin_add_user.php" method="POST">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Role</label>
      <select name="role" class="form-select" required onchange="toggleResidentFields(this.value)">
        <option value="resident">Resident</option>
        <option value="collector">Collector</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div id="resident-fields" style="display:none;">
      <div class="mb-3">
        <label class="form-label">Building Number</label>
        <input type="text" name="building_number" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Unit Number</label>
        <input type="text" name="unit_number" class="form-control">
      </div>
    </div>
    <button type="submit" class="btn btn-success">Add User</button>
  </form>
</div>

<script>
  function toggleResidentFields(role) {
    document.getElementById("resident-fields").style.display = (role === "resident") ? "block" : "none";
  }
</script>
</body>
</html>
