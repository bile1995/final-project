<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Smart Waste Sorting System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #3b8d99, #6b6b83, #aa4b6b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .login-card h2 {
      font-weight: bold;
      color: #333;
    }
    .login-card .form-label {
      font-weight: 600;
    }
    .login-card .btn-primary {
      background-color: #3b8d99;
      border: none;
    }
    .login-card .btn-primary:hover {
      background-color: #32747d;
    }
    .form-text a {
      color: #3b8d99;
      text-decoration: none;
    }
    .form-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2 class="text-center mb-4">Smart Waste Login</h2>
    <form action="../php/login.php" method="post">
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" required placeholder="example@email.com">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
      <div class="form-text text-center mt-3">
        Don’t have an account? <a href="register.html">Register here</a>
      </div>
    </form>
  </div>

</body>
</html>
