<!DOCTYPE html>
<html>
<head>
  <title>Register - Smart Waste System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="max-width: 500px; width: 100%;">
      <h2 class="text-center mb-4">Register</h2>
      <form action="../php/register.php" method="post">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Role</label>
          <select name="role" id="role" class="form-select" required>
            <option value="resident">Resident</option>
            <option value="collector">Collector</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div id="resident-extra-fields">
          <div class="mb-3">
            <label class="form-label">Residence Type</label>
            <select name="residence_type" id="residence_type" class="form-select">
              <option value="">-- Select Residence Type --</option>
              <option value="apartment">Apartment</option>
              <option value="house">House</option>
            </select>
          </div>

          <div id="apartment-fields" style="display: none;">
            <div class="mb-3">
              <label class="form-label">Building Number</label>
              <input type="text" name="building_number" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Unit Number</label>
              <input type="text" name="unit_number" class="form-control">
            </div>
          </div>

          <div id="house-fields" style="display: none;">
            <div class="mb-3">
              <label class="form-label">House Address</label>
              <input type="text" name="house_address" class="form-control">
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100">Register</button>
        <div class="text-center mt-3">
          <a href="login.html">Already have an account? Login</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    const roleSelect = document.getElementById("role");
    const residenceType = document.getElementById("residence_type");
    const extraFields = document.getElementById("resident-extra-fields");
    const apartmentFields = document.getElementById("apartment-fields");
    const houseFields = document.getElementById("house-fields");

    // Role selection toggle
    roleSelect.addEventListener("change", function () {
      if (this.value === "resident") {
        extraFields.style.display = "block";
      } else {
        extraFields.style.display = "none";
        apartmentFields.style.display = "none";
        houseFields.style.display = "none";
      }
    });

    // Residence type toggle
    residenceType.addEventListener("change", function () {
      if (this.value === "apartment") {
        apartmentFields.style.display = "block";
        houseFields.style.display = "none";
      } else if (this.value === "house") {
        apartmentFields.style.display = "none";
        houseFields.style.display = "block";
      } else {
        apartmentFields.style.display = "none";
        houseFields.style.display = "none";
      }
    });

    // Run on page load if resident is default
    document.addEventListener("DOMContentLoaded", function () {
      roleSelect.dispatchEvent(new Event("change"));
    });
  </script>
</body>
</html>
