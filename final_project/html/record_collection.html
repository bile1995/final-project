<!DOCTYPE html>
<html>
<head>
  <title>Record Bin Collection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2>Record Bin Collection</h2>
    <form action="../php/record_collection.php" method="post">
  <div class="mb-3">
    <label for="collector_id" class="form-label">Your ID</label>
    <input type="number" class="form-control" name="collector_id" required>
  </div>
  <div class="mb-3">
    <label for="bin_id" class="form-label">Bin ID</label>
    <input type="number" class="form-control" name="bin_id" required>
  </div>

  <div class="mb-3">
    <label class="form-label">How much did you empty?</label>
    <select name="emptied_percent" class="form-select" required>
      <option value="100">Fully Emptied</option>
      <option value="75">Emptied 75%</option>
      <option value="50">Emptied 50%</option>
      <option value="25">Emptied 25%</option>
    </select>
  </div>

  <button type="submit" class="btn btn-success">Record Collection</button>
</form>

  </div>
</body>
</html>
